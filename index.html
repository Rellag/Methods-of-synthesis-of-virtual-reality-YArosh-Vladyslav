<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Sievert Surface — Control Task</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Our Sievert surface component -->
    <script src="js/sievert-surface.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .a-enter-vr { display: none !important; }

        #overlay {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            max-width: 240px;
            line-height: 1.4;
        }

        #overlay b { color: #ff9933; }

        #hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 13px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.4s ease;
        }

        #hint.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <b>Sievert Surface</b><br>
        Control task — AR.js<br>
        <small>Point the camera at the marker</small>
    </div>

    <div id="hint">Searching for the marker…</div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam;
              debugUIEnabled: false;
              detectionMode: mono_and_matrix;
              matrixCodeType: 3x3;
              trackingMethod: best;">

        <!--
            Marker:
            - type="pattern" + url=... → loads our custom pattern .patt file
            - To swap to the classic HIRO marker for quick testing, set
              preset="hiro" and remove the type/url attributes.
        -->
        <a-marker
            id="sievert-marker"
            type="pattern"
            url="assets/pattern-sievert.patt"
            smooth="true"
            smoothCount="8"
            smoothTolerance="0.01"
            smoothThreshold="3"
            emitevents="true">

            <!-- The Sievert surface, dynamically aligned to the marker -->
            <a-entity
                sievert-surface="uSteps: 80;
                                 vSteps: 80;
                                 targetSize: 1.6;
                                 color: #ff9933;
                                 wireColor: #ffffff;
                                 spinSpeed: 0.0006"
                position="0 0.2 0">
            </a-entity>

            <!-- A subtle base plane so it's obvious the surface is anchored -->
            <a-ring
                color="#ffffff"
                opacity="0.25"
                radius-inner="0.95"
                radius-outer="1.0"
                rotation="-90 0 0">
            </a-ring>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Hint visibility — hide once the marker is found
        const hint = document.getElementById('hint');
        const marker = document.getElementById('sievert-marker');

        marker.addEventListener('markerFound', () => {
            hint.classList.add('hidden');
            hint.textContent = 'Marker locked ✓';
        });

        marker.addEventListener('markerLost', () => {
            hint.classList.remove('hidden');
            hint.textContent = 'Searching for the marker…';
        });
    </script>
</body>
</html>
