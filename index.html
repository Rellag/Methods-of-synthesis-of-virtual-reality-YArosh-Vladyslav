<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control Task — AR with Sievert's Surface</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
    body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    .arjs-loader {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.8); z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-family: Arial, sans-serif; font-size: 16px;
        text-align: center; padding: 20px;
    }
    .info {
        position: fixed; top: 8px; left: 8px;
        background: rgba(0,0,0,0.6); color: #fff;
        font-family: Arial, sans-serif; font-size: 12px;
        padding: 6px 10px; border-radius: 4px;
        z-index: 1000; max-width: 70vw;
    }
</style>
</head>
<body>

<div class="arjs-loader">
    <div>
        Loading AR.js…<br>
        Allow camera access when prompted.<br><br>
        Point the camera at the printed marker.
    </div>
</div>

<div class="info">Sievert's surface · point camera at the "S" marker</div>

<a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    embedded
    arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false; trackingMethod: best;">

    <a-assets>
        <a-asset-item id="markerData" src="./pattern.patt"></a-asset-item>
    </a-assets>

    <a-marker
        type="pattern"
        url="./pattern.patt"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2">

        <a-entity
            sievert-surface
            position="0 0.5 0"
            rotation="-90 0 0"
            scale="0.5 0.5 0.5">
        </a-entity>

        <a-box
            position="0 0.01 0"
            scale="1 0.02 1"
            color="#444"
            opacity="0.3">
        </a-box>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<script src="./sievert-component.js"></script>
<script>
    document.querySelector('a-scene').addEventListener('loaded', () => {
        const loader = document.querySelector('.arjs-loader');
        if (loader) loader.style.display = 'none';
    });
</script>

</body>
</html>
