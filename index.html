<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>PA#2 — Tangible interface (rotation_vector)</title>
<style>
    body {
        background-color: #1e1e1e;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }
    h2 { margin-top: 0; }
    #layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    #canvas-holder {
        background-color: #000;
        border-radius: 6px;
        overflow: hidden;
    }
    #webglcanvas { display: block; background-color: #000; }
    #controls {
        background-color: #2a2a2a;
        padding: 16px 20px;
        border-radius: 6px;
        min-width: 320px;
    }
    .ctrl { margin-bottom: 14px; }
    .ctrl label { display: block; margin-bottom: 4px; font-size: 13px; }
    .ctrl input[type=range] { width: 100%; }
    .ctrl input[type=text] {
        width: 100%;
        padding: 6px 8px;
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        box-sizing: border-box;
    }
    .val { color: #79c0ff; font-weight: bold; }
    #message { color: #aaa; font-size: 13px; max-width: 600px; }
    #sensor-status {
        font-family: monospace;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 4px;
        background: #1a1a1a;
        margin-top: 6px;
    }
    .st-off  { color: #888; }
    .st-on   { color: #79df79; }
    .st-err  { color: #ff7070; }
    button {
        padding: 8px 14px;
        cursor: pointer;
        background: #3a3a3a;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
    }
    button:hover { background: #4a4a4a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./SensorClient.js"></script>
<script src="./main.js"></script>
</head>

<body onload="init()">
    <h2>PA#2 — Tangible interface (Variant 17, rotation_vector)</h2>
    <p id="message">
        Connect to your phone running <b>Sensor Server</b> (F-Droid). When the
        checkbox below is on, the surface follows the phone's orientation
        (mouse rotation is disabled). When off — mouse-trackball control
        is restored.
    </p>

    <div id="layout">
        <div id="canvas-holder">
            <canvas width="600" height="600" id="webglcanvas"></canvas>
        </div>

        <div id="controls">
            <div class="ctrl">
                <label>Eye separation: <span id="val-eye" class="val">0.70</span></label>
                <input type="range" id="sl-eye" min="0.0" max="2.0" step="0.01" value="0.70">
            </div>
            <div class="ctrl">
                <label>Field of view (rad): <span id="val-fov" class="val">0.40</span></label>
                <input type="range" id="sl-fov" min="0.1" max="1.5" step="0.01" value="0.40">
            </div>
            <div class="ctrl">
                <label>Near clipping distance: <span id="val-near" class="val">8.00</span></label>
                <input type="range" id="sl-near" min="1.0" max="15.0" step="0.1" value="8.0">
            </div>
            <div class="ctrl">
                <label>Convergence distance: <span id="val-conv" class="val">14.00</span></label>
                <input type="range" id="sl-conv" min="8.0" max="40.0" step="0.1" value="14.0">
            </div>

            <hr style="border-color:#444">

            <div class="ctrl">
                <label>Sensor Server URL:</label>
                <input type="text" id="tx-url"
                    value="ws://192.168.1.10:8080/sensor/connect?type=android.sensor.rotation_vector"
                    placeholder="ws://<phone-ip>:8080/sensor/connect?type=android.sensor.rotation_vector">
            </div>
            <div class="ctrl" style="display:flex; gap:8px;">
                <button id="btn-connect">Connect</button>
                <button id="btn-disconnect" disabled>Disconnect</button>
            </div>
            <div class="ctrl">
                <label style="cursor:pointer">
                    <input type="checkbox" id="cb-usephone">
                    Use phone orientation (overrides mouse)
                </label>
            </div>
            <div class="ctrl">
                <button id="btn-recenter" disabled>Re-center (zero current pose)</button>
            </div>
            <div id="sensor-status" class="st-off">Disconnected</div>

            <hr style="border-color:#444">

            <div class="ctrl">
                <button id="btn-cam">Start webcam</button>
            </div>
            <div class="ctrl" style="font-size:12px;color:#888">
            </div>
        </div>
    </div>

    <video id="webcam" autoplay playsinline muted style="display:none"></video>
</body>
</html>
